name: Compile 4D Project

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile 4D Project
        uses: 4d/build4d-action@v1
        with:
          project: 'Project/Invoices.4DProject'
          targets: 'x86_64_generic'
          product-line: '20.x'
          version: '20.3'

      - name: Upload Compiled Project as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EA_Invoices-Compiled
          path: .
          if-no-files-found: error
